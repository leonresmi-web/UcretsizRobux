<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Güvenli ve mizahi bir Roblox temalı sürpriz sayfası.">
  <title>Robux Sürprizi</title>
  <style>
    :root {
      color-scheme: dark;
      --green: #38e879;
      --green-dark: #16b95a;
      --ink: #07110b;
      --white: #ffffff;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      overflow-x: hidden;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #030605 url("BackgroundPhoto.png") center / cover no-repeat fixed;
      color: var(--white);
    }

    body::before {
      position: fixed;
      inset: 0;
      z-index: 0;
      content: "";
      background:
        radial-gradient(circle at 50% 45%, rgba(0, 0, 0, .18), rgba(0, 0, 0, .62) 70%),
        rgba(0, 0, 0, .38);
      pointer-events: none;
    }

    body.modal-open { overflow: hidden; }

    .page {
      position: relative;
      z-index: 1;
      display: grid;
      min-height: 100vh;
      min-height: 100svh;
      place-items: center;
      padding: 2rem 1rem;
    }

    .hero {
      width: min(100%, 760px);
      text-align: center;
      animation: rise-in .7s ease-out both;
    }

    .eyebrow {
      margin: 0 0 .85rem;
      color: #bfffd4;
      font-size: clamp(.75rem, 1.5vw, .95rem);
      font-weight: 800;
      letter-spacing: .18em;
      text-transform: uppercase;
      text-shadow: 0 0 18px rgba(56, 232, 121, .52);
    }

    h1 {
      max-width: 720px;
      margin: 0 auto;
      font-size: clamp(2rem, 6vw, 4.8rem);
      line-height: 1.04;
      letter-spacing: -.045em;
      text-wrap: balance;
      text-shadow: 0 4px 24px rgba(0, 0, 0, .75), 0 0 22px rgba(255, 255, 255, .18);
    }

    .arrow {
      margin: 1.1rem auto .7rem;
      color: #fff4b0;
      font-size: clamp(3rem, 8vw, 5rem);
      line-height: .8;
      text-shadow: 0 0 20px rgba(255, 244, 176, .75);
      animation: bob 1.25s ease-in-out infinite;
    }

    .cta {
      min-width: min(100%, 280px);
      min-height: 68px;
      padding: 1rem 2.8rem;
      border: 2px solid rgba(255, 255, 255, .34);
      border-radius: 999px;
      background: linear-gradient(135deg, var(--green), var(--green-dark));
      box-shadow: 0 0 0 5px rgba(56, 232, 121, .08), 0 12px 34px rgba(0, 0, 0, .42), 0 0 28px rgba(56, 232, 121, .52);
      color: #03150a;
      cursor: pointer;
      font: inherit;
      font-size: clamp(1.15rem, 3vw, 1.65rem);
      font-weight: 950;
      letter-spacing: .14em;
      transition: transform .18s ease, filter .18s ease, box-shadow .18s ease;
    }

    .cta:hover { filter: brightness(1.12); transform: translateY(-3px) scale(1.035); box-shadow: 0 0 0 7px rgba(56, 232, 121, .1), 0 15px 38px rgba(0, 0, 0, .48), 0 0 38px rgba(56, 232, 121, .68); }
    .cta:active { transform: translateY(1px) scale(.97); }
    .cta:focus-visible, .close:focus-visible { outline: 4px solid #fff4b0; outline-offset: 4px; }

    .safe-note {
      max-width: 560px;
      margin: 1.1rem auto 0;
      color: rgba(255, 255, 255, .76);
      font-size: .86rem;
      line-height: 1.5;
      text-shadow: 0 2px 9px rgba(0, 0, 0, .8);
    }

    .scrim[hidden] { display: none; }

    .scrim {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: grid;
      place-items: center;
      padding: 1rem;
      background: rgba(0, 0, 0, .7);
      backdrop-filter: blur(5px);
      animation: fade-in .2s ease-out both;
    }

    .surprise {
      position: relative;
      width: min(100%, 480px);
      padding: .7rem;
      border: 1px solid rgba(255, 255, 255, .2);
      border-radius: 22px;
      background: #101511;
      box-shadow: 0 24px 90px rgba(0, 0, 0, .7), 0 0 34px rgba(56, 232, 121, .2);
      text-align: center;
      animation: pop-in .32s cubic-bezier(.2, .8, .2, 1.2) both;
    }

    .surprise img {
      display: block;
      width: 100%;
      max-height: min(68vh, 560px);
      border-radius: 16px;
      object-fit: contain;
      background: #000;
    }

    .surprise-title {
      margin: .85rem .5rem .2rem;
      font-size: 1.25rem;
      font-weight: 900;
    }

    .surprise-copy {
      margin: 0 .5rem .8rem;
      color: rgba(255, 255, 255, .75);
      font-size: .9rem;
    }

    .close {
      min-height: 42px;
      padding: .6rem 1rem;
      border: 1px solid rgba(255, 255, 255, .25);
      border-radius: 999px;
      background: rgba(255, 255, 255, .08);
      color: #fff;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
    }

    .close:hover { background: rgba(255, 255, 255, .15); }

    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(9px); } }
    @keyframes rise-in { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes pop-in { from { opacity: 0; transform: scale(.9) translateY(16px); } to { opacity: 1; transform: scale(1) translateY(0); } }

    @media (max-width: 520px) {
      .page { padding: 1.25rem .8rem; }
      .hero { width: min(100%, 420px); }
      .safe-note { font-size: .78rem; }
      .surprise { padding: .5rem; border-radius: 17px; }
      .surprise img { border-radius: 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="hero" aria-labelledby="main-title">
      <p class="eyebrow">Leondan Hediye (;</p>
      <h1 id="main-title">Eğer ücretsiz 1000 robux istiyorsan aşağıdaki butona tıkla!</h1>
      <div class="arrow" aria-hidden="true">↓</div>
      <button class="cta" id="cta" type="button" aria-controls="surprise" aria-expanded="false">TIKLA</button>
      <p class="safe-note">Bu bir saka. Hesap bilgisi falan istenmez lutfen dava açmayin..</p>
    </section>
  </main>

  <div class="scrim" id="surprise" role="dialog" aria-modal="true" aria-labelledby="surprise-title" hidden>
    <section class="surprise">
      <img src="monkey.gif" alt="Komik goril sürprizi">
      <h2 class="surprise-title" id="surprise-title">mal</h2>
      <p class="surprise-copy">lutfen bizden umudu kesmeyin <3.</p>
      <button class="close" id="close" type="button">Kapat</button>
    </section>
  </div>

  <script>
    const cta = document.getElementById('cta');
    const surprise = document.getElementById('surprise');
    const close = document.getElementById('close');

    function openSurprise() {
      surprise.hidden = false;
      cta.setAttribute('aria-expanded', 'true');
      document.body.classList.add('modal-open');
      close.focus();
    }

    function closeSurprise() {
      surprise.hidden = true;
      cta.setAttribute('aria-expanded', 'false');
      document.body.classList.remove('modal-open');
      cta.focus();
    }

    cta.addEventListener('click', openSurprise);
    close.addEventListener('click', closeSurprise);
    surprise.addEventListener('click', (event) => {
      if (event.target === surprise) closeSurprise();
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && !surprise.hidden) closeSurprise();
    });
  </script>
</body>
</html>
